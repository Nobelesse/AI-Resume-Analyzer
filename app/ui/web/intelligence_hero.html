<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intelligence Sphere</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,system-ui,-apple-system,sans-serif}
  .scene{height:100%;width:100%;position:relative;overflow:hidden;isolation:isolate;
    background:radial-gradient(ellipse 46% 65% at 82% 49%,rgba(77,75,177,.25),transparent 75%),
    radial-gradient(ellipse 36% 38% at 71% 66%,rgba(27,89,153,.11),transparent 76%),
    radial-gradient(ellipse 78% 95% at 80% 52%,rgba(74,53,166,.14),transparent 72%),
    radial-gradient(ellipse 58% 88% at 94% 82%,rgba(52,122,196,.16),transparent 82%),
    radial-gradient(circle at 86% 42%,rgba(154,135,255,.08),transparent 28%),
    linear-gradient(118deg,#030816 0%,#071124 35%,#08132a 64%,#030915 100%);}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
  .scene::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,rgba(4,10,24,.985) 0%,rgba(4,10,24,.94) 24%,rgba(4,10,24,.60) 44%,rgba(4,10,24,.05) 76%),
    linear-gradient(0deg,rgba(4,10,24,.52),transparent 22%,transparent 82%,rgba(4,10,24,.30));}
  .hero-copy{position:absolute;z-index:2;left:5.5%;top:50%;transform:translateY(-50%);max-width:620px;width:53%;pointer-events:none}
  .kicker{color:#a9c4ff;letter-spacing:.21em;font-size:12px;font-weight:800;margin-bottom:26px}
  .kicker::before{content:"";display:inline-block;width:9px;height:9px;background:#75f7d6;box-shadow:0 0 16px #75f7d6;border-radius:50%;margin-right:12px}
  h1{font-size:clamp(48px,5.3vw,84px);line-height:1.04;letter-spacing:-.055em;color:#f0f4ff;margin:0 0 24px;font-weight:850;text-wrap:balance}
  h1 span{background:linear-gradient(110deg,#eacbff,#93d8ff);background-clip:text;-webkit-background-clip:text;color:transparent}
  p{color:#cad5f1;line-height:1.7;font-size:clamp(15px,1.45vw,19px);max-width:525px;margin:0 0 27px}
  .pills{display:flex;gap:10px;flex-wrap:wrap}.pills span{border:1px solid rgba(160,175,255,.31);background:rgba(22,34,73,.68);border-radius:999px;padding:10px 14px;color:#e0e9ff;font-size:12px;white-space:nowrap;backdrop-filter:blur(8px)}
  .pills span{transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease,background .28s ease}
  .pills span:hover{transform:translateY(-3px);border-color:rgba(168,197,255,.58);background:rgba(36,49,94,.85);box-shadow:0 8px 24px rgba(69,91,189,.15)}
  @media(prefers-reduced-motion:reduce){.pills span{transition:none}.pills span:hover{transform:none}}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(max-width:780px){.hero-copy{width:88%;left:6%;top:15%;transform:none;max-width:none}.kicker{font-size:10px;margin-bottom:15px}h1{font-size:clamp(38px,8vw,54px);max-width:590px;margin-bottom:13px}p{max-width:490px;font-size:14px;margin-bottom:14px}.pills span{font-size:10px;padding:8px 10px}.scene::after{background:linear-gradient(180deg,rgba(4,10,24,.97) 0%,rgba(4,10,24,.87) 31%,rgba(4,10,24,.10) 69%,rgba(4,10,24,.24) 100%)}}
  @media(max-width:400px){.hero-copy{top:8%}h1{font-size:36px}.pills{gap:6px}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <canvas id="c"></canvas>

  <div class="hero-copy"><div class="kicker">LOCAL AI · PRIVATE BY DESIGN</div><h1>A sharper view of <span>your potential.</span></h1><p>Intelligent resume analysis, role matching and career discovery in one focused workspace.</p><div class="pills"><span>✧ Resume intelligence</span><span>◈ Skill matching</span><span>↗ Career discovery</span></div></div>

</div>
<script>
(() => {
  const scene = document.getElementById('scene');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w=0,h=0,dpr=Math.min(window.devicePixelRatio||1,2);
  let cx=0, cy=0, scale=1;
  const FRAME_PADDING = 24; // keep the projected mesh AND orbit trails inside the canvas
  let pointer = {x:0, y:0, tx:0, ty:0};
  let stars = [];
  const spherePoints = [];
  let edges = [];
  const rings = [
    {r:1.09, tiltX:0.94, tiltY:0.3, color:'rgba(182,146,255,.76)', core:'rgba(244,214,255,.99)', width:6.8, glow:32, speed: reduce ? 0 : .18},
    {r:1.16, tiltX:.36, tiltY:1.14, color:'rgba(120,226,255,.62)', core:'rgba(208,250,255,.92)', width:5.4, glow:28, speed: reduce ? 0 : -.12}
  ];
  const satellites = [{ring:0,angle:.4,speed:reduce?0:.45,size:1.9,color:'rgba(192,165,255,.75)'}];

  function resize(){
    const rect = scene.getBoundingClientRect();
    w = rect.width; h = rect.height;
    canvas.width = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const mobile = w < 780;
    // On desktop, frame the whole orb to the right of the headline.
    // Projection/tilt/orbits can expand the scene ~1.7x beyond its radius.
    cx = w * (mobile ? 0.545 : 0.792);
    cy = h * (mobile ? 0.745 : 0.50);
    const orbitBound = 1.75;
    scale = Math.max(12, Math.min(
      (cx - FRAME_PADDING) / orbitBound,
      (w - cx - FRAME_PADDING) / orbitBound,
      (cy - FRAME_PADDING) / orbitBound,
      (h - cy - FRAME_PADDING) / orbitBound,
      h * (mobile ? 0.242 : 0.348)
    ));
    buildStars();
  }

  function buildStars(){
    stars = Array.from({length: Math.max(108, Math.floor((w*h)/4700))}, (_, i) => {
      const rseed = Math.random();
      const hero = rseed > 0.968;
      const accent = !hero && rseed > 0.82;
      return {
        x: Math.random()*w,
        y: Math.random()*h,
        r: hero ? (1.15 + Math.random()*0.75) : accent ? (0.55 + Math.random()*0.42) : (0.14 + Math.pow(Math.random(), 1.85)*0.62),
        a: Math.random()*Math.PI*2,
        speed: 0.12 + Math.random()*0.34,
        hue: i % 5 === 0 ? 278 : (i % 5 === 1 ? 214 : (i % 5 === 2 ? 236 : (i % 5 === 3 ? 202 : 224))),
        twinkle: hero ? (0.9 + Math.random()*1.9) : (0.42 + Math.random()*1.25),
        shine: Math.random(),
        flare: hero || Math.random() > 0.965,
        accent,
        hero
      };
    });
  }

  function buildSphere(){
    spherePoints.length = 0;
    const n = 270;
    const golden = Math.PI * (3 - Math.sqrt(5));
    for(let i=0;i<n;i++){
      const y = 1 - (i/(n-1))*2;
      const radius = Math.sqrt(1 - y*y);
      const theta = golden * i;
      const x = Math.cos(theta) * radius;
      const z = Math.sin(theta) * radius;
      spherePoints.push({x,y,z, size: 0.75 + (i % 7)*.19});
    }
    // Cache local neighbours in 3D once rather than scan 28,680 pairs per frame.
    edges = [];
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
      const a=spherePoints[i],b=spherePoints[j];
      const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;
      const d2=dx*dx+dy*dy+dz*dz;
      if(d2 < .48*.48) edges.push([i,j,Math.sqrt(d2)]);
    }
  }

  function rotate(point, ax, ay){
    let {x,y,z} = point;
    const cosy = Math.cos(ay), siny = Math.sin(ay);
    let dx = x*cosy - z*siny;
    let dz = x*siny + z*cosy;
    x = dx; z = dz;
    const cosx = Math.cos(ax), sinx = Math.sin(ax);
    let dy = y*cosx - z*sinx;
    dz = y*sinx + z*cosx;
    return {x, y:dy, z:dz};
  }

  function project(pt){
    const depth = 4.25;
    const p = depth/(depth - pt.z);
    return {x: cx + pt.x*scale*p, y: cy + pt.y*scale*p, p, z: pt.z};
  }

  function drawBackgroundGlow(t){
    const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, scale*2.4);
    grad.addColorStop(0, 'rgba(148,176,255,0.18)');
    grad.addColorStop(0.28, 'rgba(114,98,232,0.16)');
    grad.addColorStop(0.62, 'rgba(38,52,116,0.12)');
    grad.addColorStop(1, 'rgba(5,12,30,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, scale*2.4, 0, Math.PI*2);
    ctx.fill();
    const sweepX = cx + Math.cos(t*0.45)*scale*1.6;
    const sweepY = cy + Math.sin(t*0.38)*scale*0.9;
    const sweep = ctx.createRadialGradient(sweepX, sweepY, 0, sweepX, sweepY, scale*1.6);
    sweep.addColorStop(0,'rgba(210,233,255,0.12)');
    sweep.addColorStop(0.22,'rgba(182,145,255,0.12)');
    sweep.addColorStop(1,'rgba(6,10,24,0)');
    ctx.fillStyle = sweep;
    ctx.fillRect(0,0,w,h);
  }

  function drawStars(t){
    for(const s of stars){
      const pulse = 0.5 + 0.5*Math.sin(t*s.speed + s.a);
      const shimmer = 0.5 + 0.5*Math.sin(t*s.twinkle + s.a*1.37);
      const alpha = s.hero ? (0.42 + 0.26*pulse + 0.14*shimmer) : s.accent ? (0.22 + 0.18*pulse + 0.10*shimmer) : (0.08 + 0.12*pulse + 0.08*shimmer);
      const radius = s.r * (1 + shimmer*(s.hero ? 0.18 : 0.08));
      const halo = s.r * (s.hero ? (7.0 + shimmer*5.2) : s.accent ? (3.3 + shimmer*1.9) : (1.4 + shimmer*1.2));
      const core = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, halo);
      core.addColorStop(0, `hsla(${s.hue}, 100%, ${s.hero ? 90 : 84}%, ${alpha})`);
      core.addColorStop(s.hero ? 0.14 : 0.22, `hsla(${s.hue}, 98%, ${s.hero ? 84 : 80}%, ${alpha*0.88})`);
      core.addColorStop(s.hero ? 0.46 : 0.38, `hsla(${s.hue}, 96%, 76%, ${alpha*(s.hero ? 0.30 : 0.18)})`);
      core.addColorStop(1, `hsla(${s.hue}, 96%, 70%, 0)`);
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(s.x, s.y, halo, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = `hsla(${s.hue}, 100%, ${s.hero ? 92 : 86}%, ${Math.min(1, alpha + 0.10)})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, radius, 0, Math.PI*2);
      ctx.fill();

      if(s.flare){
        const flareAlpha = s.hero ? (0.18 + 0.18*shimmer) : (0.09 + 0.08*shimmer);
        const arm = s.r * (s.hero ? (2.4 + shimmer*1.8) : (1.5 + shimmer*0.8));
        ctx.strokeStyle = `hsla(${s.hue}, 100%, 88%, ${flareAlpha})`;
        ctx.lineWidth = s.hero ? (0.75 + shimmer*0.22) : (0.34 + shimmer*0.10);
        ctx.beginPath();
        ctx.moveTo(s.x-arm, s.y); ctx.lineTo(s.x+arm, s.y);
        ctx.moveTo(s.x, s.y-arm); ctx.lineTo(s.x, s.y+arm);
        if(s.hero && s.shine > 0.58){
          const diag = arm * 0.66;
          ctx.moveTo(s.x-diag, s.y-diag); ctx.lineTo(s.x+diag, s.y+diag);
          ctx.moveTo(s.x-diag, s.y+diag); ctx.lineTo(s.x+diag, s.y-diag);
        }
        ctx.stroke();
      }
    }
  }

  function drawSphere(t){
    const ax = pointer.y * 0.31 + 0.24 * Math.sin(t*0.25);
    const ay = pointer.x * 0.50 + t * (reduce ? 0 : 0.36);
    const pts = spherePoints.map(p => {
      const r = rotate(p, ax, ay);
      const pr = project(r);
      return {...pr, nx:r.x, ny:r.y, nz:r.z, size:p.size};
    });

    // Subtle translucent interior, with the network rendered on top.
    // Layered atmospheric rim and translucent core strengthen depth perception.
    const aura = ctx.createRadialGradient(cx-scale*.24,cy-scale*.28,scale*.04,cx,cy,scale*1.26);
    aura.addColorStop(0,'rgba(156,194,255,.28)');
    aura.addColorStop(.34,'rgba(152,120,255,.24)');
    aura.addColorStop(.76,'rgba(72,132,236,.15)');
    aura.addColorStop(1,'rgba(80,130,255,0)');
    ctx.fillStyle=aura;ctx.beginPath();ctx.arc(cx,cy,scale*1.24,0,Math.PI*2);ctx.fill();
    const grd = ctx.createRadialGradient(cx-scale*.31, cy-scale*.27, scale*.02, cx, cy, scale*1.05);
    grd.addColorStop(0, 'rgba(238,224,255,.24)');
    grd.addColorStop(.14, 'rgba(206,230,255,.20)');
    grd.addColorStop(.36, 'rgba(118,138,255,.23)');
    grd.addColorStop(.68, 'rgba(34,56,144,.18)');
    grd.addColorStop(1, 'rgba(10,13,44,.05)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(cx,cy,scale*1.05,0,Math.PI*2);ctx.fill();

    const nightShadow = ctx.createRadialGradient(cx+scale*.30, cy+scale*.22, scale*.06, cx+scale*.24, cy+scale*.18, scale*1.05);
    nightShadow.addColorStop(0,'rgba(18,18,64,0)');
    nightShadow.addColorStop(.42,'rgba(18,20,70,.11)');
    nightShadow.addColorStop(.76,'rgba(10,14,44,.24)');
    nightShadow.addColorStop(1,'rgba(5,8,28,.42)');
    ctx.fillStyle = nightShadow;
    ctx.beginPath(); ctx.arc(cx,cy,scale*1.03,0,Math.PI*2); ctx.fill();
    const atmosphere = ctx.createRadialGradient(cx-scale*.38, cy-scale*.34, scale*.01, cx, cy, scale*1.14);
    atmosphere.addColorStop(0,'rgba(255,255,255,.20)');
    atmosphere.addColorStop(.12,'rgba(214,236,255,.18)');
    atmosphere.addColorStop(.42,'rgba(140,188,255,.10)');
    atmosphere.addColorStop(.78,'rgba(122,166,255,.04)');
    atmosphere.addColorStop(1,'rgba(122,166,255,0)');
    ctx.strokeStyle = 'rgba(168,212,255,.22)';
    ctx.lineWidth = scale * 0.032;
    ctx.beginPath(); ctx.arc(cx,cy,scale*0.99,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = atmosphere;
    ctx.beginPath(); ctx.arc(cx,cy,scale*1.01,0,Math.PI*2); ctx.fill();

    const haze = ctx.createRadialGradient(cx-scale*.18, cy-scale*.14, scale*.12, cx, cy, scale*.98);
    haze.addColorStop(0,'rgba(255,255,255,.045)');
    haze.addColorStop(.38,'rgba(192,214,255,.028)');
    haze.addColorStop(.72,'rgba(110,124,255,.020)');
    haze.addColorStop(1,'rgba(110,124,255,0)');
    ctx.fillStyle = haze;
    ctx.beginPath(); ctx.arc(cx,cy,scale*.96,0,Math.PI*2); ctx.fill();

    // Bright violet / electric-blue local edges reveal spherical geometry.
    for(const [i,j,dist] of edges){
      const a=pts[i],b=pts[j];
      const front=(a.nz+b.nz+2)/4;
      const strength=1-dist/.48;
      const pulse = 0.84 + 0.16*Math.sin(t*1.6 + i*.17);
      const alpha=(.07+.40*front)*(.54+.40*strength)*pulse;
      ctx.strokeStyle = i%3===0 ? `rgba(184,126,255,${alpha})` : `rgba(90,184,255,${alpha})`;
      ctx.lineWidth = .44 + front*.72;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }

    pts.sort((a,b)=>a.z-b.z);
    for(const p of pts){
      const hue = 215 + ((p.nx + 1) * 47);
      const alpha = 0.28 + ((p.nz+1)/2)*0.72;
      ctx.fillStyle = `hsla(${hue}, 96%, 76%, ${alpha})`;
      ctx.shadowBlur = p.nz > 0 ? 12 : 4; ctx.shadowColor = 'rgba(168,132,255,0.72)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.p, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    // Moving light sweep, clipped to the circular sphere silhouette.
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,scale*1.04,0,Math.PI*2);ctx.clip();
    const beamX = cx + Math.sin(t*.53)*scale*.8;
    const beam = ctx.createLinearGradient(beamX-scale*.38,cy,beamX+scale*.38,cy);
    beam.addColorStop(0,'rgba(97,160,255,0)');
    beam.addColorStop(.5,'rgba(152,190,255,.12)');
    beam.addColorStop(1,'rgba(97,160,255,0)');
    ctx.fillStyle=beam;ctx.fillRect(cx-scale*1.1,cy-scale*1.1,scale*2.2,scale*2.2);
    ctx.restore();
  }

  function orbitPoint(ring, theta, t){
    const R = scale * ring.r;
    let x = Math.cos(theta) * R;
    let z = Math.sin(theta) * R;
    let y = 0;
    // rotate around x
    let cos = Math.cos(ring.tiltX), sin = Math.sin(ring.tiltX);
    let y1 = y*cos - z*sin; let z1 = y*sin + z*cos; y=y1; z=z1;
    cos = Math.cos(ring.tiltY); sin = Math.sin(ring.tiltY);
    let x2 = x*cos + z*sin; let z2 = -x*sin + z*cos; x=x2; z=z2;
    // slight whole-system turn with time/pointer
    const sys = rotate({x:x/scale, y:y/scale, z:z/scale}, pointer.y*0.24, pointer.x*0.34 + t*0.18);
    return {x: sys.x*scale, y: sys.y*scale, z: sys.z*scale};
  }

  function traceOrbitPath(ring, t){
    const points = [];
    for(let i=0;i<=360;i++){
      const ang = (i/360) * Math.PI*2 + t*ring.speed;
      const p = orbitPoint(ring, ang, t);
      const pr = project({x:p.x/scale, y:p.y/scale, z:p.z/scale});
      points.push({x:pr.x, y:pr.y, z:p.z, ang});
    }
    return points;
  }

  function getOrbitRanges(points, predicate){
    const ranges = [];
    let start = -1;
    for(let i=0;i<points.length;i++){
      if(predicate(points[i])){
        if(start === -1) start = i;
      }else if(start !== -1){
        ranges.push([start, i-1]);
        start = -1;
      }
    }
    if(start !== -1) ranges.push([start, points.length-1]);
    if(ranges.length > 1 && ranges[0][0] === 0 && ranges[ranges.length-1][1] === points.length-1){
      const first = ranges.shift();
      const last = ranges.pop();
      ranges.unshift([last[0], first[1] + points.length]);
    }
    return ranges;
  }

  function strokeOrbitRange(points, range, stroke, lineWidth, shadowBlur, shadowColor){
    const total = points.length;
    const pad = 2;
    const start = Math.max(0, range[0] - pad);
    const end = Math.min(range[1] + pad, range[0] + total - 1);
    const sampled = [];
    for(let idx=start; idx<=end; idx++) sampled.push(points[idx % total]);
    if(sampled.length < 2) return;

    ctx.beginPath();
    ctx.moveTo(sampled[0].x, sampled[0].y);
    if(sampled.length === 2){
      ctx.lineTo(sampled[1].x, sampled[1].y);
    }else{
      for(let i=1;i<sampled.length-1;i++){
        const curr = sampled[i];
        const next = sampled[i+1];
        const midX = (curr.x + next.x) * 0.5;
        const midY = (curr.y + next.y) * 0.5;
        ctx.quadraticCurveTo(curr.x, curr.y, midX, midY);
      }
      const penult = sampled[sampled.length-2];
      const last = sampled[sampled.length-1];
      ctx.quadraticCurveTo(penult.x, penult.y, last.x, last.y);
    }
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth;
    ctx.shadowBlur = shadowBlur;
    ctx.shadowColor = shadowColor;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function strokeOrbitSection(points, predicate, stroke, lineWidth, shadowBlur, shadowColor){
    const ranges = getOrbitRanges(points, predicate);
    ranges.forEach(range => strokeOrbitRange(points, range, stroke, lineWidth, shadowBlur, shadowColor));
  }

  function drawRingAccent(ring, idx, t){
    const accentAngle = t*(ring.speed * 1.8 + 0.10) + idx*2.0;
    ctx.beginPath();
    for(let k=0;k<=22;k++){
      const ang=accentAngle + k*0.0085;
      const pos=orbitPoint(ring,ang,t);
      const q=project({x:pos.x/scale,y:pos.y/scale,z:pos.z/scale});
      if(k===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);
    }
    ctx.strokeStyle=ring.core;
    ctx.lineWidth=ring.width*0.36;
    ctx.shadowBlur=10;
    ctx.shadowColor=ring.core;
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  function drawRings(t, layer='all'){
    rings.forEach((ring, idx) => {
      const points = traceOrbitPath(ring, t);
      const isBack = pt => pt.z < 0.08;
      const isFront = pt => pt.z > -0.08;

      if(layer === 'back' || layer === 'all'){
        strokeOrbitSection(points, isBack, ring.color.replace(/rgba\(([^,]+),([^,]+),([^,]+),[^\)]+\)/, 'rgba($1,$2,$3,0.22)'), (ring.width || (idx===0 ? 6.8 : 5.4))*0.92, (ring.glow || 10)*0.60, ring.color);
        strokeOrbitSection(points, isBack, ring.core.replace(/rgba\(([^,]+),([^,]+),([^,]+),[^\)]+\)/, 'rgba($1,$2,$3,0.20)'), Math.max(1.4, (ring.width || 5.4) * 0.44), (ring.glow || 10)*0.48, ring.core);
      }

      if(layer === 'front' || layer === 'all'){
        strokeOrbitSection(points, isFront, ring.color, ring.width || (idx===0 ? 6.8 : 5.4), ring.glow || 10, ring.color);
        strokeOrbitSection(points, isFront, ring.core || ring.color, Math.max(2.2, (ring.width || 5.4) * 0.68), (ring.glow || 10) + 7, ring.core || ring.color);
        drawRingAccent(ring, idx, t);
      }
    });

    if(layer === 'front' || layer === 'all'){
      satellites.forEach(s => {
        const ring = rings[s.ring];
        const theta = s.angle + t * s.speed;
        const p = orbitPoint(ring, theta, t);
        const pr = project({x:p.x/scale, y:p.y/scale, z:p.z/scale});
        if(p.z >= -0.04){
          ctx.fillStyle = s.color;
          ctx.shadowBlur = 32;
          ctx.shadowColor = s.color;
          ctx.beginPath();
          ctx.arc(pr.x, pr.y, (s.size+0.25)*pr.p, 0, Math.PI*2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });
    }
  }

  let previousFrame = -1000;
  let animationHandle = null;
  let isRunning = false;
  function frame(now){
    if (document.hidden || !isRunning) return;
    if (!reduce && now - previousFrame < 26) { animationHandle = requestAnimationFrame(frame); return; }
    previousFrame = now;
    const t = now * 0.001;
    pointer.x += (pointer.tx - pointer.x) * 0.135;
    pointer.y += (pointer.ty - pointer.y) * 0.135;
    ctx.clearRect(0,0,w,h);
    drawBackgroundGlow(t);
    drawStars(t);
    drawRings(t, "back");
    drawSphere(t);
    drawRings(t, "front");
    if (!reduce) animationHandle = requestAnimationFrame(frame);
  }

  scene.addEventListener('pointermove', (e) => {
    const rect = scene.getBoundingClientRect();
    const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;
    pointer.tx = nx;
    pointer.ty = ny;
  });
  scene.addEventListener('pointerleave', () => { pointer.tx = 0; pointer.ty = 0; });
  function startAnimation(){
    if (isRunning || document.hidden) return;
    isRunning = true;
    animationHandle = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      isRunning = false;
      if (animationHandle !== null) cancelAnimationFrame(animationHandle);
    } else {
      startAnimation();
    }
  });
  window.addEventListener('resize', resize);
  buildSphere();
  resize();
  startAnimation();
})();
</script>
</body>
</html>
