<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:#edf0ff;font:14px system-ui,-apple-system,sans-serif;background:transparent;overflow:hidden}
.stage{position:relative;height:344px;max-width:100%;overflow:hidden;border:1px solid rgba(177,157,255,.25);border-radius:25px;background:radial-gradient(circle at 60% 50%,rgba(87,74,166,.35),transparent 48%),linear-gradient(115deg,#141d36,#10182b 70%,#11182b);perspective:950px}
.stage:before{content:"";position:absolute;inset:0;opacity:.23;background-image:linear-gradient(rgba(141,144,204,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(141,144,204,.16) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(transparent,black)}
.glow{position:absolute;width:310px;height:310px;border-radius:50%;background:radial-gradient(circle,rgba(152,109,255,.25),transparent 65%);pointer-events:none;left:50%;top:50%;transform:translate(-50%,-50%)}
.card{position:absolute;width:min(360px,76%);height:217px;top:50%;left:50%;border-radius:21px;background:linear-gradient(135deg,rgba(171,134,255,.18),rgba(49,108,182,.1)),rgba(19,28,53,.96);border:1px solid rgba(200,186,255,.5);box-shadow:0 24px 60px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.2);transform:translate(-50%,-50%) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .16s ease-out;will-change:transform;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(177,152,255,.32),transparent 44%);pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;margin:21px 23px;color:#c3c5ed;font-size:11px;letter-spacing:.15em}.chip{border:1px solid #ac93ff;border-radius:9px;padding:7px;color:#c9b8ff}.big{font-weight:800;font-size:42px;letter-spacing:-.06em;margin:24px 23px 0}.desc{color:#b9c5de;margin:7px 23px}.bars{display:flex;gap:5px;margin:18px 23px}.bars i{height:5px;border-radius:6px;display:block;background:#9d88ff;flex:2}.bars i:nth-child(2){background:#6cbde2;flex:1}.bars i:nth-child(3){background:#2b395d;flex:1}.hint{position:absolute;bottom:14px;width:100%;text-align:center;color:#aebadb;font-size:11px;letter-spacing:.05em}
@media (prefers-reduced-motion:reduce){.card{transition:none;transform:translate(-50%,-50%)!important}.glow{display:none}}
</style></head><body><div class="stage" id="stage" aria-label="Decorative interactive three-dimensional resume preview"><div class="glow" id="glow"></div><div class="card" id="card"><div class="top"><span>✦ RESUME INTEL</span><span class="chip">UI PREVIEW</span></div><div class="big">Your next move.</div><div class="desc">Intelligent resume insights, designed beautifully.</div><div class="bars"><i></i><i></i><i></i></div></div><div class="hint">MOVE YOUR CURSOR TO TILT THE CARD · PHASE 2 DEMO</div></div>
<script>
(()=>{const stage=document.getElementById('stage'),card=document.getElementById('card'),glow=document.getElementById('glow');const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce||window.matchMedia('(pointer:coarse)').matches)return;
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;card.style.setProperty('--rx',((.5-y)*13).toFixed(2)+'deg');card.style.setProperty('--ry',((x-.5)*16).toFixed(2)+'deg');card.style.setProperty('--mx',(x*100)+'%');card.style.setProperty('--my',(y*100)+'%');glow.style.left=(x*100)+'%';glow.style.top=(y*100)+'%';});stage.addEventListener('pointerleave',()=>{card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg');glow.style.left='50%';glow.style.top='50%';});})();
</script></body></html>
